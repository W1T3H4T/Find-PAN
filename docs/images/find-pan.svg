<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="DejaVu Sans,Arial,sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Find-PAN</title><desc id="desc">Files, directory trees and archives pass through a scanner using regex matching, Luhn validation and anti-PAN filtering, producing log, CSV and JSON outputs.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#18263b"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#38bdf8"/></marker></defs>
<rect width="1200" height="640" rx="24" fill="url(#bg)"/>
<text x="600" y="64" text-anchor="middle" font-size="36" font-weight="700" fill="#f8fafc">Find-PAN</text>
<text x="600" y="96" text-anchor="middle" font-size="16" fill="#b5c3d7">Find card numbers and track data in files, folders and archives</text>

<text x="48" y="151" font-size="12" fill="#8fa6c2" font-weight="700" letter-spacing="2">01   INPUTS</text>
<text x="370" y="151" font-size="12" fill="#8fa6c2" font-weight="700" letter-spacing="2">02   SCANNER</text>
<text x="910" y="151" font-size="12" fill="#8fa6c2" font-weight="700" letter-spacing="2">03   OUTPUTS</text>
