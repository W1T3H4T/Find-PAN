[project]
name = "find-pan"
version = "2.3.1"
description = "Search file systems and tar archives for PAN and track data patterns."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
	"names>=0.3.0",
	"python-magic>=0.4.27",
	"random-address>=1.1.1",
]

[dependency-groups]
dev = [
	"pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
