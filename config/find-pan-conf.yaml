# Find-PAN archive extractor configuration.
#
# This file tells find-pan.py which external programs to use when extracting
# supported archive formats.  On first run, the application can build this
# configuration by searching PATH for the commands listed below.  You may
# edit the paths to point to specific installations (for example, the 7-Zip
# directory on Windows).
#
# Supported archive types:
#   tar   - .tar, .tar.gz, .tgz, .tar.bz2, .tbz2, .tar.xz, .txz
#   zip   - .zip, .jar, .war, .ear
#   7z    - .7z
#   gzip  - .gz (single compressed file)
#
# ---------------------------------------------------------------------------
# Extractor configuration options
# ---------------------------------------------------------------------------
#
# command:
#   The executable name or absolute path used to extract this archive type.
#   A bare name (e.g. "tar", "7z") is resolved against the user's PATH at
#   runtime.  Use an absolute path for tools installed outside PATH.
#
# args:
#   A list of command-line arguments passed to the extractor.  Two template
#   placeholders are substituted at runtime:
#     {archive}  - the original archive file path
#     {tempdir}  - the temporary directory created for extracted contents
#
# copy_archive_to_tempdir:
#   When true, the original archive is copied into the temporary extraction
#   directory before the extractor runs.  This is required for in-place
#   decompressors such as gzip, which write the decompressed file next to
#   the archive.  For normal extractors (tar, unzip, 7z) this should be false.
#
# compression:
#   A list of compression algorithms this extractor can handle.  This is
#   informational metadata only; the external program is responsible for the
#   actual decompression.  It is used to document capability and may be used
#   by future features to select an extractor based on the archive's internal
#   compression method.
#
# ---------------------------------------------------------------------------
# Extraction limits (decompression-bomb protection)
# ---------------------------------------------------------------------------
#
# While an extractor runs, find-pan watches its output directory and stops
# (kills) the tool if it exceeds any of these limits.  Whatever was already
# extracted is still scanned, and the archive is reported as ARCHIVE-FAILED.
# The defaults are generous; raise or lower them here for all extractors, or
# add any of the same keys to a single extractor below to override it.
#
#   max_extracted_bytes  total size of the extracted files        (default 10 GiB)
#   max_files            number of extracted files and folders    (default 100000)
#   timeout_seconds      wall-clock time for one extraction       (default 600)
#   min_free_bytes       stop if free disk space falls below this (default 1 GiB)
#
limits:
  max_extracted_bytes: 10737418240
  max_files: 100000
  timeout_seconds: 600
  min_free_bytes: 1073741824

extractors:
  tar:
    command: tar
    args:
      - -xf
      - "{archive}"
      - -C
      - "{tempdir}"
    copy_archive_to_tempdir: false
    compression:
      - store

  zip:
    command: unzip
    args:
      - "{archive}"
      - -d
      - "{tempdir}"
    copy_archive_to_tempdir: false
    compression:
      - store
      - deflate
      - bzip2
      - lzma

  7z:
    command: 7z
    args:
      - x
      - "{archive}"
      - -o{tempdir}
      - -y
    copy_archive_to_tempdir: false
    compression:
      - store
      - lzma
      - lzma2
      - bzip2
      - deflate
      - ppmd
      - bcj2

  gzip:
    command: gzip
    args:
      - -d
      - "{archive}"
    copy_archive_to_tempdir: true
    compression:
      - deflate
