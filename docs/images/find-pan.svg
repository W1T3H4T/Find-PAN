<text x="391" y="271" font-size="15" fill="#71849f" font-family="DejaVu Sans Mono,monospace">lorem ipsum dolor sit amet</text>
<text x="391" y="306" font-size="15" fill="#71849f" font-family="DejaVu Sans Mono,monospace">card <tspan fill="#fb7185" font-weight="700">4111 1111 1111 1111</tspan> ok</text>
<text x="391" y="341" font-size="15" fill="#71849f" font-family="DejaVu Sans Mono,monospace">consectetur adipiscing elit</text>
<text x="391" y="376" font-size="15" fill="#71849f" font-family="DejaVu Sans Mono,monospace">%B<tspan fill="#fb7185" font-weight="700">4111111111111111</tspan>^DOE/J^25</text>
<text x="391" y="411" font-size="15" fill="#71849f" font-family="DejaVu Sans Mono,monospace">20240131235959 <tspan fill="#94a3b8">(anti-PAN)</tspan></text>
