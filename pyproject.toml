[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "find-pan"
version = "3.7.0"
description = "Search file systems and tar archives for PAN and track data patterns."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
	"lorem-text>=3.0",
	"names>=0.3.0",
	"python-magic>=0.4.27",
	"pyyaml>=6.0.1",
	"random-address>=1.1.1",
]

[dependency-groups]
dev = [
	"pylint>=3.3",
	"pytest>=8.0.0",
	"pytest-xdist>=3.6.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true
