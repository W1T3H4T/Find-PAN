[project]
name = "find-pan"
version = "3.1.0"
description = "Search file systems and tar archives for PAN and track data patterns."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
	"lorem-text>=3.0",
	"names>=0.3.0",
	"python-magic>=0.4.27",
	"pyyaml>=6.0.1",
	"random-address>=1.1.1",
]

[dependency-groups]
dev = [
	"pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
package = false
